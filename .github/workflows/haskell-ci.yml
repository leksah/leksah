name: Haskell-CI
on:
  - push
  - pull_request
  - merge_group
  - workflow_dispatch
jobs:
  linux:
    name: Haskell-CI - Linux - ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes:
      60
    container:
      image: buildpack-deps:noble
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      matrix:
        include:
          - compiler: ghc-9.14.1
            compilerKind: ghc
            compilerVersion: 9.14.1
            setup-method: ghcup
            allow-failure: false
      fail-fast: false
    steps:
      - name: apt-get install
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gnupg ca-certificates dirmngr curl git software-properties-common
          apt-get install -y libatk1.0-dev libgirepository1.0-dev libgraphene-1.0-dev libgtk-4-dev libharfbuzz-dev libjavascriptcoregtk-6.0-dev libsoup-3.0-dev libwebkitgtk-6.0-dev pkg-config
      - name: Install GHCup
        run: |
          mkdir -p "$HOME/.ghcup/bin"
          curl -sL https://downloads.haskell.org/ghcup/0.1.50.1/x86_64-linux-ghcup-0.1.50.1 > "$HOME/.ghcup/bin/ghcup"
          chmod a+x "$HOME/.ghcup/bin/ghcup"
      - name: Install cabal-install
        run: |
          "$HOME/.ghcup/bin/ghcup" install cabal 3.16.0.0 || (cat "$HOME"/.ghcup/logs/*.* && false)
          echo "CABAL=$HOME/.ghcup/bin/cabal-3.16.0.0 -vnormal+nowrap" >> "$GITHUB_ENV"
      - name: Install GHC (GHCup)
        if: matrix.setup-method == 'ghcup'
        run: |
          "$HOME/.ghcup/bin/ghcup" install ghc "$HCVER" || (cat "$HOME"/.ghcup/logs/*.* && false)
          HC=$("$HOME/.ghcup/bin/ghcup" whereis ghc "$HCVER")
          HCPKG=$(echo "$HC" | sed 's#ghc$#ghc-pkg#')
          HADDOCK=$(echo "$HC" | sed 's#ghc$#haddock#')
          echo "HC=$HC" >> "$GITHUB_ENV"
          echo "HCPKG=$HCPKG" >> "$GITHUB_ENV"
          echo "HADDOCK=$HADDOCK" >> "$GITHUB_ENV"
        env:
          HCKIND: ${{ matrix.compilerKind }}
          HCNAME: ${{ matrix.compiler }}
          HCVER: ${{ matrix.compilerVersion }}
      - name: Set PATH and environment variables
        run: |
          echo "$HOME/.cabal/bin" >> $GITHUB_PATH
          echo "LANG=C.UTF-8" >> "$GITHUB_ENV"
          echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"
          echo "CABAL_CONFIG=$HOME/.cabal/config" >> "$GITHUB_ENV"
          HCNUMVER=$(${HC} --numeric-version|perl -ne '/^(\d+)\.(\d+)\.(\d+)(\.(\d+))?$/; print(10000 * $1 + 100 * $2 + ($3 == 0 ? $5 != 1 : $3))')
          echo "HCNUMVER=$HCNUMVER" >> "$GITHUB_ENV"
          echo "ARG_TESTS=--enable-tests" >> "$GITHUB_ENV"
          echo "ARG_BENCH=--disable-benchmarks" >> "$GITHUB_ENV"
          echo "HEADHACKAGE=false" >> "$GITHUB_ENV"
          echo "ARG_COMPILER=--$HCKIND --with-compiler=$HC" >> "$GITHUB_ENV"
        env:
          HCKIND: ${{ matrix.compilerKind }}
          HCNAME: ${{ matrix.compiler }}
          HCVER: ${{ matrix.compilerVersion }}
      - name: env
        run: |
          env
      - name: write cabal config
        run: |
          mkdir -p $CABAL_DIR
          cat >> $CABAL_CONFIG <<EOF
          remote-build-reporting: anonymous
          write-ghc-environment-files: never
          remote-repo-cache: $CABAL_DIR/packages
          logs-dir:          $CABAL_DIR/logs
          world-file:        $CABAL_DIR/world
          extra-prog-path:   $CABAL_DIR/bin
          symlink-bindir:    $CABAL_DIR/bin
          installdir:        $CABAL_DIR/bin
          build-summary:     $CABAL_DIR/logs/build.log
          store-dir:         $CABAL_DIR/store
          install-dirs user
            prefix: $CABAL_DIR
          repository hackage.haskell.org
            url: http://hackage.haskell.org/
          EOF
          cat >> $CABAL_CONFIG <<EOF
          program-default-options
            ghc-options: $GHCJOBS +RTS -M3G -RTS
          EOF
          cat $CABAL_CONFIG
      - name: versions
        run: |
          $HC --version || true
          $HC --print-project-git-commit-id || true
          $CABAL --version || true
      - name: update cabal index
        run: |
          $CABAL v2-update -v
      - name: install cabal-plan
        run: |
          mkdir -p $HOME/.cabal/bin
          curl -sL https://github.com/haskell-hvr/cabal-plan/releases/download/v0.7.3.0/cabal-plan-0.7.3.0-x86_64-linux.xz > cabal-plan.xz
          echo 'f62ccb2971567a5f638f2005ad3173dba14693a45154c1508645c52289714cb2  cabal-plan.xz' | sha256sum -c -
          xz -d < cabal-plan.xz > $HOME/.cabal/bin/cabal-plan
          rm -f cabal-plan.xz
          chmod a+x $HOME/.cabal/bin/cabal-plan
          cabal-plan --version
      - name: checkout
        uses: actions/checkout@v7
        with:
          path: source
      - name: initial cabal.project for sdist
        run: |
          touch cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/leksah" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/lsp-types-client" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/sandpit/breakout" >> cabal.project
          cat cabal.project
      - name: sdist
        run: |
          mkdir -p sdist
          $CABAL sdist all --output-dir $GITHUB_WORKSPACE/sdist
      - name: unpack
        run: |
          mkdir -p unpacked
          find sdist -maxdepth 1 -type f -name '*.tar.gz' -exec tar -C $GITHUB_WORKSPACE/unpacked -xzvf {} \;
      - name: generate cabal.project
        run: |
          PKGDIR_leksah="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/leksah-[0-9.]*')"
          echo "PKGDIR_leksah=${PKGDIR_leksah}" >> "$GITHUB_ENV"
          PKGDIR_lsp_types_client="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/lsp-types-client-[0-9.]*')"
          echo "PKGDIR_lsp_types_client=${PKGDIR_lsp_types_client}" >> "$GITHUB_ENV"
          PKGDIR_breakout="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/breakout-[0-9.]*')"
          echo "PKGDIR_breakout=${PKGDIR_breakout}" >> "$GITHUB_ENV"
          rm -f cabal.project cabal.project.local
          touch cabal.project
          touch cabal.project.local
          echo "packages: ${PKGDIR_leksah}" >> cabal.project
          echo "packages: ${PKGDIR_lsp_types_client}" >> cabal.project
          echo "packages: ${PKGDIR_breakout}" >> cabal.project
          echo "package leksah" >> cabal.project
          echo "    ghc-options: -Werror=missing-methods -Werror=missing-fields" >> cabal.project
          echo "package lsp-types-client" >> cabal.project
          echo "    ghc-options: -Werror=missing-methods -Werror=missing-fields" >> cabal.project
          echo "package breakout" >> cabal.project
          echo "    ghc-options: -Werror=missing-methods -Werror=missing-fields" >> cabal.project
          cat >> cabal.project <<EOF
          constraints: monoidal-containers >=0.6.2.0
          constraints: any.haskell-gi-overloading ==0.0
          constraints: any.happy ==2.1.7
          constraints: extra >=1.8
          constraints: semialign <1.4
          constraints: any.haskell-gi ==0.26.16
          allow-newer: which:base
          allow-newer: which:template-haskell
          allow-newer: text-replace:base
          allow-newer: text-replace:optparse-applicative
          allow-newer: text-replace:text
          allow-newer: constraints-extras:base
          allow-newer: constraints-extras:template-haskell
          allow-newer: monoidal-containers:base
          allow-newer: monoidal-containers:aeson
          allow-newer: monoidal-containers:these
          allow-newer: reflex:base
          allow-newer: reflex:template-haskell
          allow-newer: reflex:these
          allow-newer: reflex:profunctors
          allow-newer: reflex-dom-core:base
          allow-newer: reflex-dom-core:template-haskell
          allow-newer: reflex-dom-core:aeson
          allow-newer: reflex-dom-core:these
          allow-newer: reflex-dom-core:lens
          allow-newer: reflex-dom-svg:base
          allow-newer: reflex-dom-svg:containers
          allow-newer: reflex-dom-svg:lens
          allow-newer: reflex-dom-svg:reflex
          allow-newer: reflex-dom-svg:reflex-dom-core
          allow-newer: patch:base
          allow-newer: patch:these
          allow-newer: brittany:base
          allow-newer: brittany:strict
          allow-newer: brittany:aeson
          allow-newer: data-tree-print:base
          allow-newer: network-bsd:network
          allow-newer: monad-control:transformers-compat
          allow-newer: *:base
          allow-newer: *:bytestring
          allow-newer: *:containers
          allow-newer: *:template-haskell
          allow-newer: *:time
          allow-newer: *:mmorph
          allow-newer: *:monoidal-containers
          allow-newer: *:witherable
          allow-newer: *:semialign
          allow-newer: *:aeson

          source-repository-package
            type:     git
            location: https://github.com/leksah/ffcabal
            tag:      ad54e7188587423e60d34b76334b526f5e36deed

          source-repository-package
            type:     git
            location: https://github.com/ghcjs/reflex-dom
            tag:      e57a114c5121b8fecf9eece3ee196d28120e908a
            subdir:   reflex-dom-core

          index-state: 2026-11-14T01:29:20Z
          allow-newer:
            reflex:primitive, reflex-dom-core:primitive, vado:*, reflex-dom-svg:text

          constraints: dependent-sum-template >=0.2.0.1

          package reflex
            tests: False

          package reflex-dom-core
            tests: False
          EOF
          $HCPKG list --simple-output --names-only | perl -ne 'for (split /\s+/) { print "constraints: any.$_ installed\n" unless /^(breakout|leksah|lsp-types-client)$/; }' >> cabal.project.local
          cat cabal.project
          cat cabal.project.local
      - name: dump install plan
        run: |
          $CABAL v2-build $ARG_COMPILER $ARG_TESTS $ARG_BENCH --dry-run all
          cabal-plan
      - name: restore cache
        uses: actions/cache/restore@v6
        with:
          key: noble-${{ matrix.compiler }}-${{ github.sha }}
          path: ~/.cabal/store
          restore-keys: noble-${{ matrix.compiler }}-
      - name: install dependencies
        run: |
          $CABAL v2-build $ARG_COMPILER --disable-tests --disable-benchmarks --dependencies-only -j2 all
          $CABAL v2-build $ARG_COMPILER $ARG_TESTS $ARG_BENCH --dependencies-only -j2 all
      - name: build w/o tests
        run: |
          $CABAL v2-build $ARG_COMPILER --disable-tests --disable-benchmarks all
      - name: build
        run: |
          $CABAL v2-build $ARG_COMPILER $ARG_TESTS $ARG_BENCH all --write-ghc-environment-files=always
      - name: cabal check
        run: |
          cd ${PKGDIR_leksah} || false
          ${CABAL} -vnormal check
          cd ${PKGDIR_lsp_types_client} || false
          ${CABAL} -vnormal check
          cd ${PKGDIR_breakout} || false
          ${CABAL} -vnormal check
      - name: unconstrained build
        run: |
          rm -f cabal.project.local
          $CABAL v2-build $ARG_COMPILER --disable-tests --disable-benchmarks all
      - name: save cache
        if: always()
        uses: actions/cache/save@v6
        with:
          key: noble-${{ matrix.compiler }}-${{ github.sha }}
          path: ~/.cabal/store
