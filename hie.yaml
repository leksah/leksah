# HLS cradle for leksah.
#
# Several source trees are shared by more than one cabal component, so the
# implicit cradle (a bare `cabal v2-repl <file>`) fails with
# "Cabal-7132: Ambiguous target" and NO GHC session loads — hover, go-to-def
# and live diagnostics then silently do nothing for the whole project:
#   * main/           -> three executables (leksah, -warp, -cmd)
# Pin each shared tree to one component.  hie-bios matches by longest path
# prefix, so more specific entries (e.g. main/Cmd.hs) must come before the
# general one (main/).
cradle:
  cabal:
    # leksah-cmd is a standalone exe whose main-is (Cmd.hs) lives in main/.
    - path: "./main/Cmd.hs"
      component: "leksah:exe:leksah-cmd"
    # Native web front end: the macOS exe:leksah is (src-wkwebview + main).
    - path: "./main"
      component: "leksah:exe:leksah"
    - path: "./src-wkwebview"
      component: "leksah:exe:leksah"
    # (leksah-classic/ is a separate project with its own cabal.project and its
    # own hie.yaml — HLS picks that one up when you open a file under it.)
    # The web-UI library.
    - path: "./src"
      component: "leksah:lib:leksah-nogtk"
    # The vendored LSP client types (its own single-component package).
    - path: "./lsp-types-client"
      component: "lsp-types-client:lib:lsp-types-client"
