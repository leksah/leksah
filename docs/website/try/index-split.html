<!doctype html>
<!-- SPLIT-mode variant of index.html (UI-split stage 1 proof — see
     leksah/src/IDE/Web/Bridge.hs and `leksah-warp - -split-frontend`, which serves
     this page at its root): the same ghcjs-compiled frontend runs in this
     page, but window.leksahSplitBridge makes it attach its bridge end to
     window.leksahBridge instead of an in-process pair, and jsaddle.js
     connects the NATIVE backend half (this page's server) into the same JS
     context.  Keep the asset list in sync with index.html. -->
<html>
<head>
  <meta charset="utf-8">
  <title>Leksah (split frontend)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- The split flag, read by jsMain before any bridge endpoint registers.
       Must be set before leksah.js runs. -->
  <script>window.leksahSplitBridge = true;</script>

  <script src="/try/demo-xterm-css.js"></script>
  <script src="/cm6/leksah-cm6.js"></script>
  <script src="/xterm/xterm.js"></script>
  <script src="/xterm/addon-fit.js"></script>
  <script src="/xterm/addon-webgl.js"></script>
  <script src="/xterm/addon-unicode11.js"></script>
  <script src="/xterm/addon-search.js"></script>
  <script src="/xterm/addon-image.js"></script>
  <script src="/xterm/addon-clipboard.js"></script>
  <script src="/try/demo-files.js"></script>
  <script src="/try/demo-terminals.js"></script>
  <script src="/try/demo-hovers.js"></script>
</head>
<body>
  <script src="/try/shims.js"></script>
  <!-- The native backend half: jsaddle-warp's client connects back to the
       serving process's websocket and runs bridgeBackendMain in this page's
       context.  Load order vs leksah.js doesn't matter — the bridge glue
       queues calls until both sides attach. -->
  <script src="/jsaddle.js"></script>
  <!-- The ghcjs frontend half. -->
  <script src="/try/leksah.js"></script>
  <script>
    (function () {
      var tries = 0;
      var t = setInterval(function () {
        if (typeof window.leksahOpenFile === 'function') {
          clearInterval(t);
          window.leksahOpenFile('/demo/breakout/app/Main.hs');
        } else if (++tries > 100) {
          clearInterval(t);
        }
      }, 200);
    })();
  </script>
</body>
</html>
