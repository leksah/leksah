<!doctype html>
<!-- "Try leksah" (leksah.github.io/try/) — the real leksah web UI compiled
     to JavaScript (GHC JS backend, exe:leksah's arch(javascript) branch)
     running entirely in this page.  This page plays the role of the native
     front ends' jsMain asset loader (src/IDE/Web/Main.hs): every
     <script>/<link> below mirrors one of the readFile-and-eval lines that
     are CPP'd out under ghcjs_HOST_OS, and must run BEFORE the compiled
     leksah starts so the globals it expects (window.LeksahCM, Terminal,
     FitAddon, …) already exist.

     docs/website/ is the site root (the leksah.github.io replacement); the
     shared bundles live there (root-absolute /cm6, /xterm, /pics, /fonts —
     the app's CSS references /pics and /fonts by absolute path), while the
     demo-specific files (leksah.js, demo-files.js) live next to this page.
     copy-assets.sh stages all of it; serve.sh serves the site root. -->
<html>
<head>
  <meta charset="utf-8">
  <title>Try Leksah</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- xterm.css must reach the app as TEXT (window.leksahXtermCss, generated
       by copy-assets.sh): jsMain injects it via mainWidgetWithCss exactly as
       the native front ends do.  A <link> here would NOT survive boot —
       mainWidgetWithCss rebuilds <head>, dropping page stylesheet links. -->
  <script src="demo-xterm-css.js"></script>

  <!-- CodeMirror 6 bundle (window.LeksahCM). -->
  <script src="/cm6/leksah-cm6.js"></script>

  <!-- xterm.js + the addons jsMain loads, same order. -->
  <script src="/xterm/xterm.js"></script>
  <script src="/xterm/addon-fit.js"></script>
  <script src="/xterm/addon-webgl.js"></script>
  <script src="/xterm/addon-unicode11.js"></script>
  <script src="/xterm/addon-search.js"></script>
  <script src="/xterm/addon-image.js"></script>
  <script src="/xterm/addon-clipboard.js"></script>

  <!-- The demo project (window.leksahDemoFiles) — the in-memory tree
       IDE.Web.FS reads in place of a real file system.  Generated by
       gen-demo-files.py from sandpit/breakout. -->
  <script src="demo-files.js"></script>

  <!-- The canned terminal sessions (window.leksahDemoTerminals) — captured
       tmux panes rendered as static terminal tabs.  Generated by
       gen-demo-terminals.py from terminals/*.ans. -->
  <script src="demo-terminals.js"></script>

  <!-- Precomputed hover tooltips (window.leksahDemoHovers) — real
       haskell-language-server responses captured by gen-demo-hovers.py;
       IDE.LSP serves them in place of a live server. -->
  <script src="demo-hovers.js"></script>
</head>
<body>
  <!-- Shims for C functions the JS RTS never implemented (see shims.js) —
       must load before the compiled leksah. -->
  <script src="shims.js"></script>
  <!-- Scripted smoke test; inert without ?autotest=1 (see autotest.js). -->
  <script src="autotest.js"></script>
  <!-- The compiled leksah (GHC JS backend output; staged by copy-assets.sh).
       It builds the whole UI into document.body through jsaddle, exactly as
       the native front ends do through their WebViews. -->
  <script src="leksah.js"></script>
  <!-- Land with the sample file already open: leksah registers
       window.leksahOpenFile (the same bridge as the native Open dialogs)
       once the reflex network is up, so poll briefly and open it once. -->
  <script>
    (function () {
      var tries = 0;
      var t = setInterval(function () {
        if (typeof window.leksahOpenFile === 'function') {
          clearInterval(t);
          window.leksahOpenFile('/demo/breakout/app/Main.hs');
        } else if (++tries > 100) {
          clearInterval(t);
        }
      }, 200);
    })();
  </script>
</body>
</html>
